name: Build (reusable)

# Reusable Windows build pipeline: full Release build + cpack ZIP. Called by build-artifacts.yml
# (which runs the `gate` job first) and release.yml (v* tags, no gate — merged code). See
# docs/UPSTREAM_MERGES.md and CMake/CPackProjectConfig.cmake (the combo/ship/2s2h ZIP components).

on:
  workflow_call:
    inputs:
      # The raw cpack .zip, uploaded for release.yml to attach as a Release asset. An artifact is
      # itself zipped on download, so this one arrives as a zip-inside-a-zip — fine for release.yml
      # (it unwraps it) but noise on a PR, where pr-artifacts.yml would advertise it as a download.
      release_zip:
        type: boolean
        default: false
      # comborando + its runtime DLLs (~60MB). validate-seed.yml only ever fetches this from the
      # latest successful develop run, so building/uploading it on a PR is dead weight.
      validator:
        type: boolean
        default: false

jobs:
  build:
    # Pin to VS 2022 image — matches the "Visual Studio 17 2022" generator below (see build-windows.yml).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Python3: Generate2ShipOtr (OTRExporter/extract_assets.py) and the asset-collision gate. soh packs
      # with Torch (soh-o2r-packer), whose configure step fetches tinyxml2/zlib/yaml-cpp (needs network).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Shared with the compile gate: caches the expensive vcpkg build + CMake tree.
      - name: Cache build dir (vcpkg + CMake)
        uses: actions/cache@v5
        with:
          path: build/x64
          key: build-x64-${{ hashFiles('CMakeLists.txt', 'CMake/**', 'libultraship/cmake/**', 'torch/CMakeLists.txt') }}
          restore-keys: build-x64-

      # Incremental LTCG reads the cached link databases (.ipdb/.iobj). One written by another MSVC version (the
      # runner image updates it) fails the soh link with C1354 "corrupt ipdb" (run 45779294614). Drop them so each
      # run's link starts its database fresh; the cached object files and vcpkg tree are kept.
      - name: Drop cached incremental-link databases
        shell: pwsh
        run: |
          if (Test-Path build/x64) {
            Get-ChildItem build/x64 -Recurse -File -Include *.ipdb, *.iobj | Remove-Item -Force
          }

      - name: Configure
        # See build-windows.yml: vcvars points VCPKG_ROOT at the (non-git) VS-bundled vcpkg, which
        # breaks automate-vcpkg.cmake's git pull. Point it at the build-dir vcpkg it clones+caches.
        env:
          VCPKG_ROOT: ${{ github.workspace }}/build/x64/vcpkg
        run: cmake -B build/x64 -S . -G "Visual Studio 17 2022" -A x64

      # The combo unit tests are header-only code with no game DLL, so they build in seconds; they run before the long
      # game build and their exit code is the verdict. Same set as the Linux job. They land in build/x64/combo/Release
      # (the multi-config generator), not in x64/Release with the game.
      - name: Unit tests
        shell: pwsh
        run: |
          $tests = 'combo_anchor_tests', 'comboDiscordTest', 'comboBackToBackTest', 'comboSharedHealthSlotsTest',
                   'comboSharedHealthTest', 'comboLauncherLogTest'
          foreach ($test in $tests) {
            cmake --build build/x64 --target $test --config Release
            if ($LASTEXITCODE -ne 0) { throw "Building $test failed" }
            & "build/x64/combo/Release/$test.exe"
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }

      # Order matters: libultraship -> soh -> 2ship (2ship builds ZAPD/OTRExporter; soh builds Torch).
      # comboui + Ship2Ship pull the rest of the runtime in as dependencies.
      - name: Build libultraship
        run: cmake --build build/x64 --target libultraship --config Release
      - name: Build soh
        run: cmake --build build/x64 --target soh --config Release
      - name: Build 2ship
        run: cmake --build build/x64 --target 2ship --config Release
      # Headless seed validator (pulls libultraship/soh/2ship as deps, already built above). Run below on every build,
      # and uploaded when a caller asks for the validator so validate-seed.yml can download it from develop instead of
      # doing its own build.
      - name: Build comborando
        run: cmake --build build/x64 --target comborando --config Release
      # Windows loads the game modules by file name and resolves each export in the module it names, which Linux and
      # macOS do not check. A few seeds of each kind the Linux job runs prove both DLLs load and answer.
      - name: Seed checks (comborando)
        working-directory: x64/Release
        shell: pwsh
        run: |
          $runs = @(
            @('--seed', 'ci-win-smoke', '--count', '2'),
            @('--seed', 'ci-win-solo-oot', '--count', '1', '--games', 'oot'),
            @('--seed', 'ci-win-solo-mm', '--count', '1', '--games', 'mm'),
            @('--seed', 'ci-win-unified', '--count', '1', '--unified'),
            @('--seed', 'ci-win-cross', '--count', '1', '--cross', 'all,pct=25'),
            @('--seed', 'ci-win-shared', '--count', '1', '--shared-items', 'all')
          )
          foreach ($run in $runs) {
            & ./comborando.exe @run
            if ($LASTEXITCODE -ne 0) { throw "comborando $($run -join ' ') exited with $LASTEXITCODE" }
          }
      - name: Build comboui
        run: cmake --build build/x64 --target comboui --config Release
      - name: Build Ship2Ship
        run: cmake --build build/x64 --target Ship2Ship --config Release

      # Port asset archives (--norom). GenerateSohOtr builds Torch's soh-o2r-packer and
      # Generate2ShipOtr builds ZAPD on demand. They must run before cpack — the ship/2s2h ZIP components install
      # ${CMAKE_BINARY_DIR}/soh/soh.o2r and .../mm/2ship.o2r.
      - name: Generate soh.o2r
        run: cmake --build build/x64 --target GenerateSohOtr --config Release
      - name: Generate 2ship.o2r
        run: cmake --build build/x64 --target Generate2ShipOtr --config Release

      # cpack -G ZIP merges the combo/ship/2s2h components into one archive under _packages/.
      # Call cpack directly with -C Release so the multi-config generator can't package Debug by
      # mistake (the build-tree CPackConfig.cmake carries CPACK_PROJECT_CONFIG_FILE from configure).
      - name: Package (cpack ZIP)
        working-directory: build/x64
        run: cpack -G ZIP -C Release

      # Extract the cpack archive before upload. GitHub always zips artifact contents on download, so
      # uploading the .zip directly yields a zip-inside-a-zip; uploading the extracted tree makes the
      # downloaded Ship2Ship-windows.zip hold the runtime files directly.
      - name: Stage package contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem _packages/*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath _packages/stage -Force

      - name: Upload Ship2Ship artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ship2Ship-windows
          path: _packages/stage
          if-no-files-found: error

      # The raw cpack .zip (not the staged tree) for release.yml to attach directly as a Release asset.
      - name: Upload package zip (release asset)
        if: inputs.release_zip
        uses: actions/upload-artifact@v4
        with:
          name: Ship2Ship-package-zip
          path: _packages/*.zip
          if-no-files-found: error

      # comborando.exe + its deployed runtime DLLs (no o2r — the reachability oracle needs none).
      # validate-seed.yml downloads this from the latest successful develop run instead of rebuilding.
      - name: Upload comborando validator
        if: inputs.validator
        uses: actions/upload-artifact@v4
        with:
          name: comborando-windows
          path: |
            x64/Release/comborando.exe
            x64/Release/*.dll
          if-no-files-found: error
