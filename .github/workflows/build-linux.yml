name: Build (Linux)

# Reusable Linux build pipeline: full Release build (Ninja + gcc), port o2r generation, and a
# headless comborando seed-generation smoke test — the same end-to-end check used to validate the
# port locally (the fill runs both games' oracles in-process, so it exercises the ELF combo ABI
# without ROMs). Produces a runnable Ship2Ship-linux artifact (users add their own extracted
# oot.o2r/mm.o2r) plus a self-contained Ship2Ship-linux-appimage — the plain tree links against
# the runner's system libraries, so on other distros it needs a matching ABI (see
# docs/BUILDING_LINUX.md); the AppImage bundles them. Called by build-artifacts.yml (gate runs
# there) and release.yml (v* tags, no gate — merged code).

on:
  workflow_call:
    inputs:
      # Manual runs only (build-artifacts.yml, workflow_dispatch): the whole Archipelago test set, and the fill failure
      # rate over many seeds per option preset. A push runs the two-seed smoke check instead.
      ap_suite:
        type: boolean
        default: false
      ap_fill_rate:
        type: boolean
        default: false
      ap_fill_count:
        type: number
        default: 50
      ap_fill_presets:
        type: string
        default: all

env:
  # The Archipelago core the apworld is generated against. Move it on purpose: a new core can change generation.
  AP_CORE_REPO: ArchipelagoMW/Archipelago
  AP_CORE_REF: 2c64ef42af2389280d06ad2058e5b4c73d44f981

jobs:
  build:
    # 24.04, not 22.04: the port is developed and tested against noble's apt packages (SDL 2.30.x,
    # tinyxml2 10.0), which are new enough that upstream 2ship's source-built SDL/tinyxml2 steps
    # (a jammy workaround) aren't needed here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Upstream 2ship's apt-deps.txt set, plus libzip + tools for the ZAPD/o2r pipeline.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libusb-dev libusb-1.0-0-dev libsdl2-dev libsdl2-net-dev libpng-dev libglew-dev \
            nlohmann-json3-dev libtinyxml2-dev libspdlog-dev ninja-build \
            libogg-dev libopus-dev opus-tools libopusfile-dev libvorbis-dev \
            libzip-dev zipcmp zipmerge ziptool libssl-dev

      # ~2600 objects across lus/soh/2ship/combo: ccache is the difference between ~90 min cold
      # and a few minutes warm. Cache is only saved on branch pushes so PR runs can't pollute it.
      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          save: ${{ github.event_name == 'push' }}
          key: ${{ runner.os }}-linux-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-linux-ccache-${{ github.ref }}
            ${{ runner.os }}-linux-ccache

      # The apworld's own modules and the oracle client, against a fake oracle: no Archipelago, no comborando.
      - name: Ship2Ship apworld unit tests
        run: python3 -I scripts/ap/test_apworld.py

      # Python3: Generate2ShipOtr (OTRExporter/extract_assets.py) and the asset-collision gate. soh packs
      # with Torch (soh-o2r-packer), whose configure step fetches tinyxml2/zlib/yaml-cpp (needs network).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # LUS_BUILD_TESTS adds libultraship's lus_tests target (gtest, fetched at configure); nothing builds it
      # until the lus_tests step below.
      - name: Configure
        run: >
          cmake -B build-cmake -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUS_BUILD_TESTS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Co-op rules (combo/net: outbox, packet ids and dedup, MM flag masks) are header-only with no game
      # code, so they build in seconds. They run before the long game build; the exit code is the verdict.
      - name: Co-op unit tests (combo_anchor_tests)
        run: |
          cmake --build build-cmake --target combo_anchor_tests -j 4
          ./build-cmake/combo/combo_anchor_tests

      # Discord Rich Presence formatter, framing and socket paths are pure header code: no Discord needed.
      - name: Discord presence unit tests (comboDiscordTest)
        run: |
          cmake --build build-cmake --target comboDiscordTest -j 4
          ./build-cmake/combo/comboDiscordTest

      # The back-to-back mode's options, mode storage and item locks are pure header code too.
      - name: Back-to-back unit tests (comboBackToBackTest)
        run: |
          cmake --build build-cmake --target comboBackToBackTest -j 4
          ./build-cmake/combo/comboBackToBackTest

      # The Archipelago oracle protocol against fake logic oracles: pure header code.
      - name: Oracle protocol unit tests (comboOracleServerTest)
        run: |
          cmake --build build-cmake --target comboOracleServerTest -j 4
          ./build-cmake/combo/comboOracleServerTest

      # The Archipelago slot's seed and the foreign kind it adds: pure header code.
      - name: Archipelago seed unit tests (comboApSeedTest)
        run: |
          cmake --build build-cmake --target comboApSeedTest -j 4
          ./build-cmake/combo/comboApSeedTest

      # The Archipelago client's bookkeeping (which checks to send, which items to give): pure header code.
      - name: Archipelago client bookkeeping unit tests (comboApSyncTest)
        run: |
          cmake --build build-cmake --target comboApSyncTest -j 4
          ./build-cmake/combo/comboApSyncTest

      # The Archipelago console's text model (server messages as coloured lines, the scrollback, wrapping, typed input):
      # pure header code.
      - name: Archipelago console unit tests (comboApConsoleTest)
        run: |
          cmake --build build-cmake --target comboApConsoleTest -j 4
          ./build-cmake/combo/comboApConsoleTest

      # The playthrough walk and the requiredness pare-down against fake logic oracles: pure header code.
      - name: Playthrough unit tests (comboPlaythroughTest)
        run: |
          cmake --build build-cmake --target comboPlaythroughTest -j 4
          ./build-cmake/combo/comboPlaythroughTest

      # Which slot each game's shared health state belongs to: pure header code.
      - name: Shared health slot unit tests (comboSharedHealthSlotsTest)
        run: |
          cmake --build build-cmake --target comboSharedHealthSlotsTest -j 4
          ./build-cmake/combo/comboSharedHealthSlotsTest

      # The shared health bar's heart tally (half value, counted once per pickup): pure header code.
      - name: Shared health tally unit tests (comboSharedHealthTest)
        run: |
          cmake --build build-cmake --target comboSharedHealthTest -j 4
          ./build-cmake/combo/comboSharedHealthTest

      # The launcher's log buffer (lines wait for the game's logger, the buffer is bounded): pure header code.
      - name: Launcher log unit tests (comboLauncherLogTest)
        run: |
          cmake --build build-cmake --target comboLauncherLogTest -j 4
          ./build-cmake/combo/comboLauncherLogTest

      # wss:// to archipelago.gg (libssl-dev's static OpenSSL, the host's CA bundle and the bundled cacert.pem): a handshake
      # with full verification that must pass, and must be refused for another host name. Skipped with a warning when the
      # runner has no network. The AppImage runs the same probe below.
      - name: Certificate probe (archipelago.gg), test harness
        run: |
          cmake --build build-cmake --target comboApClientHarness -j 4
          python3 -I scripts/ap/tls_probe.py --ca-bundle combo/net/cacert/cacert.pem --ca-flag=--cert-store -- build-cmake/combo/comboApClientHarness --tls-probe

      # Same order as the Windows pipeline: libultraship -> soh (Torch) -> 2ship (OTRExporter/ZAPD),
      # then the combo targets. -j 4 caps peak memory: some soh/2ship TUs are
      # >1 GB each at peak, and the 16 GB standard runner OOMs before Ninja's default parallelism
      # helps (locally 20 jobs OOM'd a 21 GB machine).
      - name: Build libultraship
        run: cmake --build build-cmake --target libultraship -j 4
      # libultraship's own tests: archives, paths, the resource-manager scope and the combo menu serializer. ctest runs
      # each test from the folder where lus_tests was built.
      - name: libultraship unit tests (lus_tests)
        run: |
          cmake --build build-cmake --target lus_tests -j 4
          ctest --test-dir build-cmake/libultraship --output-on-failure
      - name: Build soh
        run: cmake --build build-cmake --target soh -j 4
      - name: Build 2ship
        run: cmake --build build-cmake --target 2ship -j 4
      - name: Build comborando
        run: cmake --build build-cmake --target comborando -j 4
      - name: Build comboui
        run: cmake --build build-cmake --target comboui -j 4
      - name: Build Ship2Ship
        run: cmake --build build-cmake --target Ship2Ship -j 4

      # Port asset archives (--norom), same as the Windows job.
      - name: Generate soh.o2r
        run: cmake --build build-cmake --target GenerateSohOtr -j 4
      - name: Generate 2ship.o2r
        run: cmake --build build-cmake --target Generate2ShipOtr -j 4

      # End-to-end smoke: generate + validate one cross-world seed with both games' logic oracles
      # loaded in-process. Catches symbol-interposition and combo-ABI regressions that compiling
      # can't. Runs from the deploy dir because the tool dlopens ./libsoh.so & ./lib2ship.so.
      # Fixed seed keeps failures reproducible; exit code is the verdict (0 = beatable).
      - name: Smoke-test seed generation (comborando)
        working-directory: build-cmake/combo
        shell: bash
        env:
          FILL_LOG: ${{ github.workspace }}/fill.log
        run: ./comborando --seed ci-linux-smoke --count 1 2>&1 | tee -a "$FILL_LOG"

      # The Archipelago world: Archipelago's own Generate.py (pinned core) runs Ship2Ship slots whose access rules are
      # comborando's oracle. Every slot's seed must equal its slot_data, and a solo slot must pass comborando
      # --playthrough, which is our own check, independent of Archipelago's fill. Nothing here needs ROMs. A push runs
      # two solo seeds; the whole set (solo, beside another game, two slots, an item link, start inventory from pool,
      # item plando) and the failure rate run by hand.
      - name: Check out the Archipelago core (pinned)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.AP_CORE_REPO }}
          ref: ${{ env.AP_CORE_REF }}
          path: archipelago-core
      - name: Install the Archipelago core's requirements and the apworld
        run: |
          # kivy and its relatives are for the clients; generating never imports them.
          grep -viE '^(kivy|kivymd|pyshortcuts|pymem)' archipelago-core/requirements.txt > ap-requirements.txt
          python3 -m pip install -r ap-requirements.txt
          python3 -I scripts/ap/pack_apworld.py --out ap-build/ship2ship.apworld
          mkdir -p archipelago-core/custom_worlds
          cp ap-build/ship2ship.apworld archipelago-core/custom_worlds/
          echo "ship2ship_options:" > archipelago-core/host.yaml
          echo "  comborando_path: $PWD/build-cmake/combo/comborando" >> archipelago-core/host.yaml
          cat archipelago-core/host.yaml
      - name: Archipelago smoke check, two solo seeds
        if: ${{ !inputs.ap_suite && !inputs.ap_fill_rate }}
        timeout-minutes: 20
        run: >
          python3 -I scripts/ap/ap_generate.py --ap-root archipelago-core
          --comborando "$PWD/build-cmake/combo/comborando" --work ap-run --fill-rate --count 2
          --presets default --max-failure-percent 0
      - name: Generate Ship2Ship slots in Archipelago
        if: inputs.ap_suite
        timeout-minutes: 45
        run: >
          python3 -I scripts/ap/ap_generate.py --ap-root archipelago-core
          --comborando "$PWD/build-cmake/combo/comborando" --work ap-run
      # The real client (comboApClientHarness) over a fake game, against Archipelago's own MultiServer on this machine: the
      # start inventory arrives, then wss:// (a loopback address, whose certificate is not checked) and the certificate
      # checks on 127.0.0.2 (a trusted certificate connects; an untrusted one, and a trusted one for another address, are
      # refused with a message that names the reason). Everything is bound to 127.x.x.x; nothing leaves the runner.
      - name: Archipelago client end to end, over wss://
        timeout-minutes: 25
        env:
          SKIP_REQUIREMENTS_UPDATE: '1'
        run: |
          python3 -I scripts/ap/ap_generate.py --ap-root archipelago-core --comborando "$PWD/build-cmake/combo/comborando" \
            --work ap-e2e-gen --cases start-inventory
          python3 -I scripts/ap/client_e2e.py --ap-core archipelago-core --harness "$PWD/build-cmake/combo/comboApClientHarness" \
            --ids apworld/ship2ship/data/ids.json --work ap-e2e --wss \
            --start-inventory ap-e2e-gen/start-inventory/out/AP_*.zip
      - name: Upload the Archipelago generation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ap-generation
          path: |
            ap-run/**/generate.log
            ap-run/**/players/*.yaml
            ap-run/*/out/*.zip
            ap-run/fill-rate.json
            ap-e2e/**/*.log
          if-no-files-found: ignore

      # The apworld a release attaches: the zip Archipelago loads from custom_worlds.
      - name: Upload the Ship2Ship apworld
        uses: actions/upload-artifact@v4
        with:
          name: Ship2Ship-apworld
          path: ap-build/ship2ship.apworld
          if-no-files-found: error

      # Stages the runnable tree (binaries + assets + port o2rs; game archives oot.o2r / mm.o2r
      # are ROM-extracted by the user and never built or shipped here) and packages it as a
      # self-contained AppImage — linuxdeploy bundles the system .so deps and combo/linux/AppRun
      # recreates the launcher's portable cwd layout in a writable data dir at run time.
      - name: Stage Linux package + build AppImage
        run: ./scripts/linux/make-appimage.sh build-cmake _packages

      # The AppImage's own OpenSSL and CA lookup: the launcher's hidden --ap-tls-probe, run through AppRun. It must find its
      # bundled cacert.pem by itself, and OpenSSL must be inside the executable, not a library of the host.
      - name: Certificate probe through the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          if ldd build-cmake/combo/Ship2Ship | grep -E 'libssl|libcrypto'; then
            echo "OpenSSL is a shared library of Ship2Ship: it must be linked statically" >&2
            exit 1
          fi
          appimage=$(ls _packages/Ship2Ship-*-linux-x86_64.AppImage | head -1)
          python3 -I scripts/ap/tls_probe.py --expect-bundled -- "$PWD/$appimage" --ap-tls-probe

      - name: Upload Ship2Ship-linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ship2Ship-linux
          path: _packages/stage
          if-no-files-found: error

      # GitHub zips artifact contents on download, which drops the exec bit — the docs tell users
      # to chmod +x the AppImage after unzipping (standard for CI-distributed AppImages).
      - name: Upload Ship2Ship-linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Ship2Ship-linux-appimage
          path: _packages/Ship2Ship-*-linux-x86_64.AppImage
          if-no-files-found: error

      # The seed kinds the default runs never reach: one game alone (each ROM's own logic and pool), Unified Inventory,
      # cross-game entrances, and Shared Items. A few seeds each keeps this to a minute or two; every run exits non-zero
      # when a seed is unbeatable or cannot be generated.
      - name: Seed checks, solo games, unified, cross entrances, shared items (comborando)
        working-directory: build-cmake/combo
        shell: bash
        env:
          FILL_LOG: ${{ github.workspace }}/fill.log
        run: |
          gen() { ./comborando "$@" 2>&1 | tee -a "$FILL_LOG"; }
          gen --seed ci-solo-oot --count 3 --games oot
          gen --seed ci-solo-mm --count 3 --games mm
          gen --seed ci-unified --count 3 --unified
          gen --seed ci-cross --count 3 --cross all,pct=25
          gen --seed ci-shared --count 3 --shared-items all
          gen --seed ci-shared-unified --count 2 --shared-items all --unified --lost-woods-link

      # The Lost Woods link changes the cross-game crossing the logic uses (Lost Woods hub instead of the Mask
      # Shop), and with the Majora's Mask start it changes the forced settings. Generate a handful of seeds each
      # way, then replay one link-on seed forward to prove it beatable.
      - name: Seed checks, Lost Woods link on and off (comborando)
        working-directory: build-cmake/combo
        shell: bash
        env:
          FILL_LOG: ${{ github.workspace }}/fill.log
        run: |
          gen() { ./comborando "$@" 2>&1 | tee -a "$FILL_LOG"; }
          gen --seed ci-lwl-off --count 5 --no-lost-woods-link
          gen --seed ci-lwl-off-mm --count 5 --no-lost-woods-link --starting-game mm
          gen --seed ci-lwl-on --count 5 --lost-woods-link
          gen --seed ci-lwl-on-mm --count 5 --lost-woods-link --starting-game mm
          gen --seed ci-lwl-on-replay --count 1 --lost-woods-link --starting-game mm
          ./comborando --playthrough saves/combo/comborando.spoiler.json

      # Every seed above must come out exactly as pinned. The fingerprint covers the placements and everything the setup
      # decided before the fill, so a refactor that moves any of it fails here. A change that is meant to move seeds
      # regenerates the table with --update and says why.
      - name: Pinned fill fingerprints
        run: python3 -I scripts/ap/check_fill_hashes.py --log fill.log --expected scripts/ap/expected-fill-hashes.linux.txt

      # Every item and check of both libraries under its Archipelago name, and the id table that must name them all.
      # The dump is uploaded so a stale table can be regenerated from it (scripts/ap/update_tables.py --write).
      - name: Archipelago tables (comborando --ap-tables)
        working-directory: build-cmake/combo
        run: |
          ./comborando --ap-tables "$RUNNER_TEMP/ap-tables.json"
          cp "$GITHUB_WORKSPACE/apworld/ship2ship/data/ids.json" "$RUNNER_TEMP/ids-regenerated.json" || true
          python3 -I "$GITHUB_WORKSPACE/scripts/ap/update_tables.py" --tables "$RUNNER_TEMP/ap-tables.json"             --ids "$RUNNER_TEMP/ids-regenerated.json" --write
      - name: Check the id table
        if: hashFiles('apworld/ship2ship/data/ids.json') != ''
        run: python3 -I scripts/ap/update_tables.py --tables "$RUNNER_TEMP/ap-tables.json" --check
      - name: Upload Archipelago tables
        uses: actions/upload-artifact@v4
        with:
          name: ap-tables
          path: |
            ${{ runner.temp }}/ap-tables.json
            ${{ runner.temp }}/ids-regenerated.json
            ${{ runner.temp }}/groups.json
          if-no-files-found: warn

      # Only the manual fill-rate run: how often Archipelago's fill fails on Ship2Ship slots, per option preset. The
      # target is under 2%; the step fails above it.
      - name: Archipelago fill failure rate
        if: inputs.ap_fill_rate
        timeout-minutes: 330
        run: >
          python3 -I scripts/ap/ap_generate.py --ap-root archipelago-core
          --comborando "$PWD/build-cmake/combo/comborando" --work ap-run --fill-rate
          --count ${{ inputs.ap_fill_count }} --presets ${{ inputs.ap_fill_presets }}
      - name: Upload the fill-rate result
        if: inputs.ap_fill_rate && always()
        uses: actions/upload-artifact@v4
        with:
          name: ap-fill-rate
          path: ap-run/fill-rate.json
          if-no-files-found: ignore

      # The oracle (`comborando --oracle`) against the game's own fill and playthrough: parity sphere by sphere,
      # monotonicity under random item chains, determinism, finalize, and per-call times. Generate mode writes
      # saves/combo/ into the folder it runs in, so it runs in the build folder.
      - name: Oracle parity, monotonicity and timing
        timeout-minutes: 30
        run: python3 -I scripts/ap/oracle_parity.py --comborando "$PWD/build-cmake/combo/comborando" --cwd build-cmake/combo
